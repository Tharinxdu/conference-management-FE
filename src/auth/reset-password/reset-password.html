<!-- FILE: src/app/auth/reset-password/reset-password.html -->

<app-page-shell title="Reset Password" subtitle="Choose a new password for your account.">
  <section class="card reset-wrapper">
    <h2 class="card-title">Set a new password</h2>
    <p class="card-subtitle">
      This reset link may expire (e.g., 30 minutes). If it fails, request a new one from the login page.
    </p>

    <div class="token-warning" *ngIf="!token()">
      <p>Reset link is missing or invalid. Please request a new one.</p>
      <button type="button" class="primary-button" (click)="goToLogin()">Go to login</button>
    </div>

    <form *ngIf="token()" novalidate [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-grid">
        <div class="form-group full-width">
          <label for="newPassword">New Password <span class="required">*</span></label>

          <input
            [type]="showPassword() ? 'text' : 'password'"
            id="newPassword"
            name="password"
            required
            formControlName="password"
            autocomplete="new-password"
          />

          <small class="help-text">Minimum 8 characters.</small>

          <label class="show-password">
            <input type="checkbox" [checked]="showPassword()" (change)="togglePassword()" />
            <span>{{ showPassword() ? 'Hide password' : 'Show password' }}</span>
          </label>

          <div class="error-message">{{ errorFor('password') }}</div>
        </div>

        <div class="form-group full-width">
          <label for="confirmNewPassword">Confirm Password <span class="required">*</span></label>

          <input
            [type]="showConfirmPassword() ? 'text' : 'password'"
            id="confirmNewPassword"
            name="confirmPassword"
            required
            formControlName="confirmPassword"
            autocomplete="new-password"
          />

          <label class="show-password">
            <input
              type="checkbox"
              [checked]="showConfirmPassword()"
              (change)="toggleConfirmPassword()"
            />
            <span>{{ showConfirmPassword() ? 'Hide password' : 'Show password' }}</span>
          </label>

          <div class="error-message">{{ errorFor('confirmPassword') }}</div>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="primary-button" [disabled]="loading()">
          {{ loading() ? 'Resetting…' : 'Reset password' }}
        </button>

        <button type="button" class="secondary-button" (click)="goToLogin()" [disabled]="loading()">
          Back to login
        </button>
      </div>
    </form>
  </section>
</app-page-shell>
